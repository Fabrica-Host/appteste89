name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'debug ou release'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build 89 Fm Curitiba
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already added"

      - name: Generate icons & splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        if: github.event.inputs.release_type == 'release' || github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — fazendo build debug"
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      - name: Write signing config
        if: env.SKIP_RELEASE != 'true' && (github.event.inputs.release_type == 'release' || github.event_name == 'push')
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=keystore.jks
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          # Patch app/build.gradle to use signing config
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          src = p.read_text()
          if 'signingConfigs' not in src:
              inject = """
              signingConfigs {
                  release {
                      if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                          storeFile file(MYAPP_RELEASE_STORE_FILE)
                          storePassword MYAPP_RELEASE_STORE_PASSWORD
                          keyAlias MYAPP_RELEASE_KEY_ALIAS
                          keyPassword MYAPP_RELEASE_KEY_PASSWORD
                      }
                  }
              }
              """
              src = re.sub(r'(android\s*\{)', r'\1' + inject, src, count=1)
              src = src.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }')
              p.write_text(src)
          PY

      - name: Build AAB (release)
        if: env.SKIP_RELEASE != 'true' && (github.event.inputs.release_type == 'release' || github.event_name == 'push')
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build APK (debug fallback)
        if: env.SKIP_RELEASE == 'true' || github.event.inputs.release_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload AAB
        if: env.SKIP_RELEASE != 'true' && (github.event.inputs.release_type == 'release' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: 89rockcuritiba-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish to Google Play (internal)
        if: env.SKIP_RELEASE != 'true' && (github.event.inputs.release_type == 'release' || github.event_name == 'push')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.89rockcuritiba.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft


      - name: Upload Debug APK
        if: env.SKIP_RELEASE == 'true' || github.event.inputs.release_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: 89rockcuritiba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
